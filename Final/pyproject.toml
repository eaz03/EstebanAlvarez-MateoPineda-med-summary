[project]
name = "medsummary"
version = "0.1.0"
description = "Doctor-patient dialogue to clinical note: fine-tuned summarizer, RAG and Flow-Judge harness"
requires-python = ">=3.12"   # notebook cell 70 uses 3.12 f-string syntax
dependencies = [
    "torch",                  # macOS arm64 wheels include MPS (Apple GPU) support
    "transformers",
    "peft",
    "accelerate",
    "datasets",
    "evaluate",
    "rouge_score",
    "bert_score",
    "sentence-transformers",
    "chromadb",
    "rank_bm25",
    "pymupdf",
    "python-dateutil",
    "pydantic",
    "pyyaml",
    "pandas",
    "numpy",
    "tqdm",
    "wandb",
    "python-dotenv",
    "fastapi",
    "llama-cpp-python",       # GGUF (quantized Qwen). On a Mac it compiles with Metal (Apple GPU) on install
    "huggingface-hub",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medsummary"]
