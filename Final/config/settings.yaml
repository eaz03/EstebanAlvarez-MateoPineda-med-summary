# Names, paths and numbers. Text that a model reads lives in prompts/.
# device: auto = cuda > mps > cpu (see core/models/base.py: detect_device)
# dtype per model, as in the notebook: summarizer float32 (default), instruct 'auto', judge float16.
seed: 42
device: auto
paths:
  adapter_dir: artifacts/m1_lora_adapter
  corpus_pdf: data/Medical_terminology.pdf
  eval_set: data/eval_set.json
  outputs: metricas            # tables and results (in git, unlike artifacts/)
  logs: logs/peticiones.jsonl  # one JSON line per request of the deployed API (not in git)
models:
  summarizer: google/flan-t5-base
  adapter_name: m1
  instruct: Qwen/Qwen2.5-1.5B-Instruct
  judge: flowaicom/Flow-Judge-v0.1
  embedder: BAAI/bge-small-en-v1.5
  reranker: cross-encoder/ms-marco-MiniLM-L-12-v2
  gguf_repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF       # official Qwen repository
  gguf_archivos:
    q8_0: qwen2.5-1.5b-instruct-q8_0.gguf          # ~int8
    q4_k_m: qwen2.5-1.5b-instruct-q4_k_m.gguf      # ~int4
summarizer:
  max_input_len: 512
  max_target_len: 200
  num_beams: 4
  no_repeat_ngram_size: 4
  batch: 8
instruct:
  dtype: auto
  max_new_tokens: 220
  max_new_tokens_decomposition: 100
  max_new_tokens_elegir_termino: 15
  max_new_tokens_tool: 60
judge:
  dtype: float16   # TODO(later): Flow-Judge weights are bfloat16 per its model card; test bfloat16
  max_new_tokens: 192
  max_new_tokens_ragas: 512
corpus:
  fuente: Medical Terminology, 2e (Ernstmeyer & Christman, Open RN, Chippewa Valley Technical College, 2024)
retrieval:
  k: 10
  n_hybrid: 20
  rrf_k: 60
  k_por_expresion: 3
  max_expresiones: 6
  min_score: 0.0
  embed_batch: 32
  chroma_lote: 1000
  chroma_collection: corpus_med_summary
  reranker_max_length: 512
  query_prefix: 'Represent this sentence for searching relevant passages: '
  stopwords: a an the of in on at to for with and or is are was were be what which who how this that it its as by from has have had she he they his her their patient presents presenting complains complaining medical term
tools:
  similitud_minima: 0.5
  max_intentos: 2
harness:
  umbral_bert: 0.6
  umbral_juez: 4.0
sanity:
  oracion_inventada: ' The patient also reports chest pain and takes warfarin 5 mg daily.'
  expectativas:
    referencia:
      grounding:
      - alto
      - 4
      coverage:
      - alto
      - 4
      form:
      - alto
      - 4
    dialogo:
      grounding:
      - alto
      - 4
      coverage:
      - alto
      - 4
      form:
      - bajo
      - 2
    inventada:
      grounding:
      - bajo
      - 3
      coverage:
      - alto
      - 4
      form:
      - alto
      - 4
    recortada:
      grounding:
      - alto
      - 4
      coverage:
      - bajo
      - 3
      form:
      - alto
      - 4
  juez_que_debe_detectarlo:
    dialogo: form
    inventada: grounding
    recortada: coverage
training:
  lora:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.1
    target_modules:
    - q
    - v
  args:
    output_dir: artifacts/m1_lora_out
    learning_rate: 0.0002
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    num_train_epochs: 3
    weight_decay: 0.01
    eval_strategy: epoch
    predict_with_generate: true
    logging_steps: 25
    report_to: wandb
dataset:
  columnas: [dialogue, section_text]
  urls:
    train: https://raw.githubusercontent.com/abachaa/MTS-Dialog/refs/heads/main/Main-Dataset/MTS-Dialog-TrainingSet.csv
    validation: https://raw.githubusercontent.com/abachaa/MTS-Dialog/refs/heads/main/Main-Dataset/MTS-Dialog-ValidationSet.csv
    test1: https://raw.githubusercontent.com/abachaa/MTS-Dialog/refs/heads/main/Main-Dataset/MTS-Dialog-TestSet-1-MEDIQA-Chat-2023.csv
    test2: https://raw.githubusercontent.com/abachaa/MTS-Dialog/refs/heads/main/Main-Dataset/MTS-Dialog-TestSet-2-MEDIQA-Sum-2023.csv
metricas:
  bertscore_lang: en
  rescale_with_baseline: true
comparacion:
  sistemas_evaluar: [baseline, finetuned, rag_base, rag_avanzado]   # notebook cell 88: 'tools' is generated but not evaluated
wandb:
  proyecto: medsummary
despliegue:                    # the deployed system (src/medsummary/api/main.py)
  variante: q4_k_m             # Qwen of the agent: sin_cuantizar, q8_0 or q4_k_m (see metricas/tabla_cuantizacion.csv)
  max_caracteres: 6000         # longest dialogue accepted (eval set max ~800; Flan-T5 reads 512 tokens anyway)
  aviso: Sugerencia generada por un sistema de IA. Un profesional de la salud debe revisarla y tomar la decisión final.
